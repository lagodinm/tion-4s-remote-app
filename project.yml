name: TionBreezer
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TionKit:
    path: Packages/TionKit

targets:
  TionBreezer:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: TionKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Breezer
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "Breezer connects to your Tion Breezer 4S over Bluetooth to show its readings, change settings and store schedules on it."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: TionBreezer
        PRODUCT_BUNDLE_IDENTIFIER: local.tionbreezer.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

schemes:
  TionBreezer:
    build:
      targets:
        TionBreezer: all
    run:
      config: Debug
    archive:
      config: Release
